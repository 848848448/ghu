# Cloudflare Worker configuration.
#
# Your private values (API_URL, AUDIO_API_BASE, USER_TOKEN) are NOT stored
# here. Set them as encrypted Cloudflare secrets instead:
#
#   npx wrangler secret put API_URL
#   npx wrangler secret put AUDIO_API_BASE
#   npx wrangler secret put USER_TOKEN
#
# Secrets live encrypted in Cloudflare — never in this repo, never on GitHub,
# and the token is never sent to the browser.

name = "jewish-music-downloader"
main = "worker.js"
compatibility_date = "2025-01-01"

# --- Optional: storage for accounts + app settings (the Admin panel) ---
# The Admin panel (accounts, app name, announcement, feature toggles) needs a
# small storage area. Use EITHER a D1 SQL database OR a KV namespace — both free.
#
# Option A — D1 (SQL database). Tables are created automatically on first use.
#   1. Create it:  npx wrangler d1 create zing-db
#      (or dashboard: Storage & Databases -> D1 -> Create)
#   2. Put the database_id it prints below and uncomment these lines:
#
# [[d1_databases]]
# binding = "DB"
# database_name = "zing-db"
# database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"
#
# Option B — KV namespace.
#   1. npx wrangler kv namespace create ZING_KV  (or dashboard -> KV -> Create)
#   2. Put the id below and uncomment these lines:
#
# [[kv_namespaces]]
# binding = "ZING_KV"
# id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"
#
# The master password is the SITE_PASSWORD secret; it always works and unlocks
# the admin screen. With neither store bound the app still works — everyone just
# uses the one SITE_PASSWORD.
